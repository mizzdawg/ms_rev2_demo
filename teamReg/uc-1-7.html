<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Team Registration - Step 7</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">

  <a href="uc-1-6.html" class="back-link">Back</a>

  <h1>Check your answers</h1>

  <dl class="summary-list">

    <div class="summary-row">
      <dt class="summary-key">Team name</dt>
      <dd class="summary-value">Dorchester FC</dd>
      <dd class="summary-action"><a href="uc-1-1.html">Edit<span class="visually-hidden"> team name</span></a></dd>
    </div>

    <div class="summary-row">
      <dt class="summary-key">League</dt>
      <dd class="summary-value">OTHSL</dd>
      <dd class="summary-action"><a href="uc-1-2.html">Edit<span class="visually-hidden"> league</span></a></dd>
    </div>

    <div class="summary-row">
      <dt class="summary-key">Age group</dt>
      <dd class="summary-value">Over 40</dd>
      <dd class="summary-action"><a href="uc-1-3.html">Edit<span class="visually-hidden"> age group</span></a></dd>
    </div>

    <div class="summary-row">
      <dt class="summary-key">Start date</dt>
      <dd class="summary-value">Fall 2026</dd>
      <dd class="summary-action"><a href="uc-1-4.html">Edit<span class="visually-hidden"> start date</span></a></dd>

    <div class="summary-row">
      <dt class="summary-key">Registration deposit</dt>
      <dd class="summary-value">$50</dd>
    </div>

    <div class="summary-row">
      <dt class="summary-key">Payment method</dt>
      <dd class="summary-value">Credit Card</dd>
      <dd class="summary-action"><a href="uc-1-6.html">Edit<span class="visually-hidden"> payment method</span></a></dd>

  <button class="button"><a href="uc-1-8.html">Confirm and submit</a></button>
