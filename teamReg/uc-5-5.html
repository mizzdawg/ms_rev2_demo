<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Team Registration - Step 5</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">

  <a href="uc-5-4.html" class="back-link">Back</a>

  <h1>How would you like to pay?</h1>

  <p>You are paying <strong>$50</strong>.</p>

  <div class="form-group">

    <label class="radio-item">
      <input type="radio" name="payment-method" value="paypal">
      PayPal
    </label>

    <label class="radio-item">
      <input type="radio" name="payment-method" value="venmo">
      Venmo
    </label>

    <label class="radio-item">
      <input type="radio" name="payment-method" value="credit-card">
      Credit Card
    </label>

  </div>

  <div class="payment-box" id="paypal-fields">

    <label class="label" for="paypal-email">PayPal Email Address</label>
    <input type="text" id="paypal-email">

  </div>

  <div class="payment-box" id="venmo-fields">

    <label class="label" for="venmo-username">Venmo Username</label>
    <input type="text" id="venmo-username">

  </div>

  <div class="payment-box" id="credit-card-fields">

    <label class="label" for="card-number">Card Number</label>
    <input type="text" id="card-number">

    <br><br>

    <label class="label" for="card-expiration">Expiration Date</label>
    <input type="text" id="card-expiration">

    <br><br>

    <label class="label" for="card-cvv">CVV</label>
    <input type="text" id="card-cvv">

  </div>

  <br>

  <button class="button"><a href="uc-5-6.html">Submit Payment</a></button>

</div>
<script src="payment-toggle.js" defer></script>
</body>
</html>
